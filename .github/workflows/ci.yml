name: CI

# push 与 pull_request 都跑；同时允许被 docker-publish.yml 以 reusable workflow 调用（C13）。
# 只盯分支：tag 推送由 docker-publish.yml 走 workflow_call 触发，避免同一次发版跑两遍。
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

jobs:
  ci:
    name: typecheck / lint / test / build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # 显式钉版本，与 Dockerfile 的 node:22-alpine 对齐，不吃 runner 默认版
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Assert npm ls has no invalid entries
        run: |
          npm ls --depth=0
          if npm ls --depth=0 2>&1 | grep -q 'invalid'; then
            echo '::error::npm ls --depth=0 报出 invalid 依赖'
            exit 1
          fi

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Build 必须排在 Test 前面：服务端有两个用例依赖前端构建产物
      # （static.test.ts 扫 packages/client/dist/assets；hardening.test.ts 断言
      # 带上凭据访问 / 返回 index.html）。CI 是干净树、没有 dist，顺序反了就会
      # 一个 ENOENT、一个 404。本地因为 dist 一直在，所以发现不了。
      - name: Build
        run: npm run build

      - name: Test
        run: npm test